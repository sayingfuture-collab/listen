<body>
<div>
  <p><b>무료 맛보기</b> 페이지로 이동합니다…</p>
  <p><a href="https://www.postype.com/@nyejun/post/22835390">바로 열리지 않으면 여기를 눌러 주세요</a></p>
</div>
<script>
(function () {
  var target = "https://www.postype.com/@nyejun/post/22835390";
  var src = (new URLSearchParams(location.search).get("src") || "direct")
              .replace(/[^A-Za-z0-9_-]/g, "").slice(0, 32);
  var done = false;
  function go() { if (!done) { done = true; location.replace(target); } }
  // 집계 픽셀이 떠난 뒤 이동한다. 응답이 없어도 1.2초 뒤 반드시 이동(안전장치)
  var px = new Image();
  px.onload = px.onerror = go;
  px.src = "https://nyejun.goatcounter.com/count?p=" + encodeURIComponent("/f/" + src) +
           "&t=" + encodeURIComponent("무료 맛보기") +
           "&r=" + encodeURIComponent(document.referrer);
  setTimeout(go, 1200);
})();
</script>
</body>
